name: Docs check

on:
  pull_request:
  push:
    branches:
      - "release/**"
    paths:
      - "docs/**"
      - ".github/workflows/docs-check.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    name: Docs are consistent with the pinned release
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope regressions (no-docs, workflow-only, docs-only, large list)
        run: node scripts/docs-scope-regressions.js

      - name: Decide whether this run is in docs scope
        id: scope
        env:
          PR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: node scripts/check-docs-release.js --scope

      - name: Set up node
        if: steps.scope.outputs.docs_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation toolchain
        if: steps.scope.outputs.docs_changed == 'true'
        run: npm ci

      - name: Check source snippets, checked-in llms copies and the built site
        if: steps.scope.outputs.docs_changed == 'true'
        run: node scripts/check-docs-release.js --build

      - name: Gate (fail-closed, always reports)
        if: always()
        run: |
          set -euo pipefail
          SCOPE="${{ steps.scope.outputs.docs_changed }}"
          case "$SCOPE" in
            true)
              if [ "${{ job.status }}" != "success" ]; then
                echo "docs scope: install and/or check steps above failed - see that step."
                exit 1
              fi
              echo "docs scope: install, pinned-release assertions and the build all passed."
              ;;
            false)
              echo "out of docs scope: neither docs/** nor this workflow file changed; toolchain skipped by design."
              ;;
            *)
              echo "cannot tell whether this run was in docs scope (scope step produced no explicit true/false); refusing to report success."
              exit 1
              ;;
          esac

  maven-drift:
    name: Docs pin still matches Maven Central
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compare the pinned docs release with the live Maven Central release
        run: node scripts/check-docs-release.js --drift
